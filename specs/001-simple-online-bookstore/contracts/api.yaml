openapi: 3.0.3
info:
  title: Simple Online Bookstore API
  description: API for browsing books, managing shopping cart, and placing orders
  version: 1.0.0
  contact:
    name: Bookstore Development Team
    email: dev@bookstore.com

servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://api.bookstore.com
    description: Production server

paths:
  # Books API
  /api/books:
    get:
      summary: Get paginated list of books
      description: Retrieve books from catalog with pagination support
      tags:
        - Books
      parameters:
        - name: page
          in: query
          description: Page number (1-indexed)
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Books retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookListResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Cart API
  /api/cart:
    get:
      summary: Get current shopping cart
      description: Retrieve current cart contents
      tags:
        - Cart
      responses:
        '200':
          description: Cart retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '404':
          description: Cart not found (empty cart)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    post:
      summary: Add book to cart
      description: Add a book to the shopping cart (replaces existing item in simplified model)
      tags:
        - Cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToCartRequest'
      responses:
        '200':
          description: Book added to cart successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          description: Invalid book code or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/cart/update:
    post:
      summary: Update cart item quantity
      description: Update the quantity of an item in the cart
      tags:
        - Cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartRequest'
      responses:
        '200':
          description: Cart updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          description: Invalid quantity or book code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Cart not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Orders API
  /api/orders:
    get:
      summary: List all orders
      description: Get list of all orders with basic information
      tags:
        - Orders
      responses:
        '200':
          description: Orders retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    post:
      summary: Create new order
      description: Place a new order with customer information and delivery address
      tags:
        - Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderFormData'
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Validation error or invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders/{orderNumber}:
    get:
      summary: Get order details
      description: Retrieve detailed information for a specific order
      tags:
        - Orders
      parameters:
        - name: orderNumber
          in: path
          description: Unique order identifier
          required: true
          schema:
            type: string
            pattern: '^ORD-[0-9]{8}-[0-9]{3}$'
            example: 'ORD-20251011-001'
      responses:
        '200':
          description: Order details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    # Core Entities
    Book:
      type: object
      required:
        - code
        - name
        - author
        - price
        - imageUrl
      properties:
        code:
          type: string
          pattern: '^book-[0-9]+$'
          description: Unique book identifier
          example: 'book-001'
        name:
          type: string
          maxLength: 200
          description: Full book title
          example: 'The Great Gatsby'
        author:
          type: string
          maxLength: 100
          description: Author name
          example: 'F. Scott Fitzgerald'
        price:
          type: number
          multipleOf: 0.01
          minimum: 0.01
          maximum: 9999.99
          description: Price in USD
          example: 19.99
        imageUrl:
          type: string
          format: uri
          description: URL to book cover image
          example: 'https://example.com/covers/great-gatsby.jpg'

    CartItem:
      type: object
      required:
        - code
        - name
        - price
        - quantity
      properties:
        code:
          type: string
          pattern: '^book-[0-9]+$'
          description: Book code reference
          example: 'book-001'
        name:
          type: string
          maxLength: 200
          description: Book name (snapshot)
          example: 'The Great Gatsby'
        price:
          type: number
          multipleOf: 0.01
          minimum: 0.01
          description: Unit price (snapshot)
          example: 19.99
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          description: Quantity in cart
          example: 2

    Cart:
      type: object
      required:
        - totalAmount
      properties:
        item:
          allOf:
            - $ref: '#/components/schemas/CartItem'
            - nullable: true
          description: Single cart item (simplified model)
        totalAmount:
          type: number
          multipleOf: 0.01
          minimum: 0
          description: Calculated total amount
          example: 39.98

    Customer:
      type: object
      required:
        - name
        - email
        - phone
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          description: Customer full name
          example: 'John Doe'
        email:
          type: string
          format: email
          maxLength: 254
          description: Customer email address
          example: 'john.doe@example.com'
        phone:
          type: string
          minLength: 1
          maxLength: 50
          description: Customer phone number
          example: '+1-555-123-4567'

    Order:
      type: object
      required:
        - orderNumber
        - status
        - customer
        - deliveryAddress
        - items
        - totalAmount
        - createdAt
      properties:
        orderNumber:
          type: string
          pattern: '^ORD-[0-9]{8}-[0-9]{3}$'
          description: Unique order identifier
          example: 'ORD-20251011-001'
        status:
          type: string
          enum: ['NEW', 'CONFIRMED', 'PROCESSING', 'SHIPPED', 'DELIVERED', 'CANCELLED']
          description: Current order status
          example: 'NEW'
        customer:
          $ref: '#/components/schemas/Customer'
        deliveryAddress:
          type: string
          maxLength: 500
          minLength: 1
          description: Full delivery address
          example: '123 Main St, Anytown, ST 12345, USA'
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CartItem'
          description: Ordered items (snapshot)
        totalAmount:
          type: number
          multipleOf: 0.01
          minimum: 0.01
          description: Total order amount
          example: 39.98
        createdAt:
          type: string
          format: date-time
          description: Order creation timestamp
          example: '2025-10-11T10:30:00Z'

    # Request Models
    AddToCartRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^book-[0-9]+$'
          description: Book code to add to cart
          example: 'book-001'

    UpdateCartRequest:
      type: object
      required:
        - code
        - quantity
      properties:
        code:
          type: string
          pattern: '^book-[0-9]+$'
          description: Book code to update
          example: 'book-001'
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          description: New quantity
          example: 3

    OrderFormData:
      type: object
      required:
        - customer
        - deliveryAddress
      properties:
        customer:
          $ref: '#/components/schemas/Customer'
        deliveryAddress:
          type: string
          maxLength: 500
          minLength: 1
          description: Complete delivery address
          example: '123 Main St, Anytown, ST 12345, USA'

    # Response Models
    BookListResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Book'
          description: Array of books for current page
        pagination:
          type: object
          required:
            - page
            - pageSize
            - totalPages
            - totalItems
          properties:
            page:
              type: integer
              minimum: 1
              description: Current page number (1-indexed)
              example: 1
            pageSize:
              type: integer
              minimum: 1
              maximum: 50
              description: Items per page
              example: 10
            totalPages:
              type: integer
              minimum: 0
              description: Total number of pages
              example: 5
            totalItems:
              type: integer
              minimum: 0
              description: Total books in catalog
              example: 42

    OrderListResponse:
      type: object
      required:
        - orders
      properties:
        orders:
          type: array
          items:
            type: object
            required:
              - orderNumber
              - status
            properties:
              orderNumber:
                type: string
                pattern: '^ORD-[0-9]{8}-[0-9]{3}$'
                example: 'ORD-20251011-001'
              status:
                type: string
                enum: ['NEW', 'CONFIRMED', 'PROCESSING', 'SHIPPED', 'DELIVERED', 'CANCELLED']
                example: 'NEW'

    OrderDetailResponse:
      type: object
      required:
        - order
      properties:
        order:
          $ref: '#/components/schemas/Order'

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error type identifier
          example: 'VALIDATION_ERROR'
        message:
          type: string
          description: Human-readable error message
          example: 'Invalid email format'
        details:
          type: object
          description: Additional error details
          example:
            field: 'customer.email'
            code: 'INVALID_FORMAT'

tags:
  - name: Books
    description: Book catalog operations
  - name: Cart
    description: Shopping cart management
  - name: Orders
    description: Order placement and tracking