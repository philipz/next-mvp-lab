openapi: 3.0.3
info:
  title: Online Bookstore API
  version: 1.0.0
  description: API for browsing books, managing shopping cart, and placing orders

paths:
  # Books API
  /api/books:
    get:
      operationId: listBooks
      summary: Get paginated list of books
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (1-indexed)
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          description: Number of items per page
      responses:
        "200":
          description: Successful response with paginated book list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookListResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # Cart API
  /api/cart:
    get:
      operationId: getCart
      summary: Get current shopping cart
      responses:
        "200":
          description: Current cart contents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "404":
          description: Cart not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: addToCart
      summary: Add book to cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToCartRequest"
      responses:
        "200":
          description: Book added to cart successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          description: Invalid book code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/cart/update:
    post:
      operationId: updateCart
      summary: Update cart item quantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCartRequest"
      responses:
        "200":
          description: Cart updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          description: Invalid quantity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Cart not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # Orders API
  /api/orders:
    get:
      operationId: listOrders
      summary: Get list of all orders
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createOrder
      summary: Create new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderFormData"
      responses:
        "201":
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/orders/{orderNumber}:
    get:
      operationId: getOrder
      summary: Get order details by order number
      parameters:
        - in: path
          name: orderNumber
          required: true
          schema:
            type: string
          description: Order number (e.g., ORD-20250110-001)
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetailResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    # Book Schemas
    Book:
      type: object
      required: [code, name, author, price, imageUrl]
      properties:
        code:
          type: string
          description: Unique book identifier
          example: "book-001"
        name:
          type: string
          description: Full book title
          minLength: 1
          example: "A Game of Thrones"
        author:
          type: string
          description: Author name
          minLength: 1
          example: "George R.R. Martin"
        price:
          type: number
          format: float
          description: Price in USD
          minimum: 0
          example: 19.20
        imageUrl:
          type: string
          format: uri
          description: URL to book cover image
          example: "/images/books/game-of-thrones.jpg"

    Pagination:
      type: object
      required: [page, pageSize, totalPages, totalItems]
      properties:
        page:
          type: integer
          minimum: 1
          description: Current page number (1-indexed)
        pageSize:
          type: integer
          minimum: 1
          description: Items per page
        totalPages:
          type: integer
          minimum: 0
          description: Total number of pages
        totalItems:
          type: integer
          minimum: 0
          description: Total number of items in catalog

    BookListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Book"
          description: Array of books for current page
        pagination:
          $ref: "#/components/schemas/Pagination"

    # Cart Schemas
    CartItem:
      type: object
      required: [code, name, price, quantity]
      properties:
        code:
          type: string
          description: Book code
          example: "book-001"
        name:
          type: string
          description: Book name
          minLength: 1
          example: "A Game of Thrones"
        price:
          type: number
          format: float
          description: Unit price in USD
          minimum: 0
          example: 19.20
        quantity:
          type: integer
          description: Quantity in cart
          minimum: 1
          example: 2

    Cart:
      type: object
      required: [totalAmount]
      properties:
        item:
          allOf:
            - $ref: "#/components/schemas/CartItem"
          nullable: true
          description: Single cart item (null if cart is empty)
        totalAmount:
          type: number
          format: float
          description: Total amount (price × quantity)
          minimum: 0
          example: 38.40

    AddToCartRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: Book code to add to cart
          minLength: 1
          example: "book-001"

    UpdateCartRequest:
      type: object
      required: [code, quantity]
      properties:
        code:
          type: string
          description: Book code
          minLength: 1
          example: "book-001"
        quantity:
          type: integer
          description: New quantity
          minimum: 1
          example: 3

    # Order Schemas
    Customer:
      type: object
      required: [name, email, phone]
      properties:
        name:
          type: string
          description: Customer name
          minLength: 1
          example: "John Doe"
        email:
          type: string
          format: email
          description: Customer email address
          example: "john.doe@example.com"
        phone:
          type: string
          description: Customer phone number
          minLength: 1
          example: "+1-555-0123"

    OrderFormData:
      type: object
      required: [customer, deliveryAddress]
      properties:
        customer:
          $ref: "#/components/schemas/Customer"
        deliveryAddress:
          type: string
          description: Full delivery address
          minLength: 1
          example: "123 Main St, Apt 4B, New York, NY 10001"

    Order:
      type: object
      required: [orderNumber, status, customer, deliveryAddress, items, totalAmount, createdAt]
      properties:
        orderNumber:
          type: string
          description: Unique order identifier
          example: "ORD-20250110-001"
        status:
          type: string
          description: Order status
          enum: [NEW, CONFIRMED, SHIPPED, DELIVERED, CANCELLED]
          example: "NEW"
        customer:
          $ref: "#/components/schemas/Customer"
        deliveryAddress:
          type: string
          description: Delivery address
          minLength: 1
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
          description: Ordered items
          minItems: 1
        totalAmount:
          type: number
          format: float
          description: Total order amount in USD
          minimum: 0
        createdAt:
          type: string
          format: date-time
          description: Order creation timestamp (ISO 8601)
          example: "2025-01-10T14:30:00Z"

    OrderSummary:
      type: object
      required: [orderNumber, status]
      properties:
        orderNumber:
          type: string
          description: Order number
          example: "ORD-20250110-001"
        status:
          type: string
          description: Order status
          enum: [NEW, CONFIRMED, SHIPPED, DELIVERED, CANCELLED]
          example: "NEW"

    OrderListResponse:
      type: object
      required: [orders]
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/OrderSummary"
          description: List of order summaries

    OrderDetailResponse:
      type: object
      required: [order]
      properties:
        order:
          $ref: "#/components/schemas/Order"

    # Error Schema
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Error message
          example: "Book not found"
